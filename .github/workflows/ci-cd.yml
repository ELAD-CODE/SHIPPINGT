name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, TRACK-AI]
  pull_request:
    branches: [main, develop]

jobs:
  # Secret Scanning Job - runs first to catch leaked secrets
  secret-scan:
    name: 🔒 Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for gitleaks

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Lint Job
  lint:
    name: 🔍 Lint
    runs-on: ubuntu-latest
    needs: secret-scan  # Only run if secrets check passes
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # Build Job
  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build
        env:
          # Provide dummy values for build-time env vars
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
          TRACKINGMORE_API_KEY: "dummy_key_for_build"
          SESSION_SECRET: "dummy_session_secret_min_32_chars_long"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: .next/
          retention-days: 7

  # Test Job
  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          DATABASE_URL: "postgresql://test:test@localhost:5432/test"
          TRACKINGMORE_API_KEY: "test_key"
          SESSION_SECRET: "test_session_secret_min_32_chars_long"

      - name: Upload test coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  # Deploy to AWS Staging (example)
  deploy-staging:
    name: 🚀 Deploy to AWS Staging
    runs-on: ubuntu-latest
    needs: [lint, build, test]
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/TRACK-AI'
    environment:
      name: staging
      url: https://staging.shipment-tracking.example.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: .next/

      - name: Deploy to S3 (example)
        run: |
          echo "🚀 Deploying to S3 bucket: ${{ secrets.S3_BUCKET }}"
          # aws s3 sync .next/ s3://${{ secrets.S3_BUCKET }}/staging/ --delete
          echo "✅ Deployment completed"

      - name: Notify deployment
        run: |
          echo "✅ Staging deployment successful"
          echo "URL: https://staging.shipment-tracking.example.com"

  # Deploy to Production
  deploy-production:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    needs: [lint, build, test]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://shipment-tracking.example.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: .next/

      - name: Deploy to S3 (example)
        run: |
          echo "🚀 Deploying to S3 bucket: ${{ secrets.S3_BUCKET }}"
          # aws s3 sync .next/ s3://${{ secrets.S3_BUCKET }}/production/ --delete
          # aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
          echo "✅ Production deployment completed"

      - name: Notify deployment
        run: |
          echo "✅ Production deployment successful"
          echo "URL: https://shipment-tracking.example.com"
