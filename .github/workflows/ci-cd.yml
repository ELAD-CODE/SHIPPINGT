name: CI/CD Pipeline

on:
  push:
    branches:
      - staging
  pull_request:
    branches:
      - main

env:
  NODE_VERSION: '18'

jobs:
  # ======================================
  # Secret Scanning (First Line of Defense)
  # ======================================
  secret-scan:
    name: 🔐 Secret Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for comprehensive scanning

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }} # Optional: for premium features

  # ======================================
  # Build & Test
  # ======================================
  build-and-test:
    name: 🏗️ Build, Lint & Test
    runs-on: ubuntu-latest
    needs: secret-scan  # Only proceed if no secrets detected
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
            .next/cache
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm test
        env:
          # Mock environment variables for testing
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          TRACKINGMORE_API_KEY: test_key
          SESSION_SECRET: test_secret_for_ci_at_least_32_chars
          SKIP_ENV_VALIDATION: true

      - name: Build project
        run: npm run build
        env:
          # Minimal env vars for build
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          TRACKINGMORE_API_KEY: test_key
          SESSION_SECRET: test_secret_for_ci_at_least_32_chars
          SKIP_ENV_VALIDATION: true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: build-artifacts
          path: .next
          retention-days: 7

  # ======================================
  # Security Audit
  # ======================================
  security-audit:
    name: 🛡️ Security Audit
    runs-on: ubuntu-latest
    needs: secret-scan
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run npm audit
        run: npm audit --audit-level=high
        continue-on-error: true  # Don't fail build, but report issues

      - name: Check for vulnerabilities
        run: |
          if npm audit --audit-level=critical | grep -q "found"; then
            echo "❌ Critical vulnerabilities found!"
            exit 1
          fi

  # ======================================
  # Deploy to AWS (Staging only)
  # ======================================
  deploy-staging:
    name: 🚀 Deploy to AWS Staging
    runs-on: ubuntu-latest
    needs: [build-and-test, security-audit]
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
    environment: staging
    permissions:
      contents: read
      id-token: write  # For AWS OIDC authentication
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: .next

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to S3
        run: |
          aws s3 sync .next s3://${{ secrets.S3_BUCKET }}/builds/$(date +%Y%m%d-%H%M%S)/ --delete
          echo "✅ Build artifacts uploaded to S3"

      - name: Invalidate CloudFront cache (if applicable)
        run: |
          if [ -n "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" ]; then
            aws cloudfront create-invalidation \
              --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
              --paths "/*"
            echo "✅ CloudFront cache invalidated"
          else
            echo "ℹ️  No CloudFront distribution configured"
          fi
        continue-on-error: true

      - name: Deploy notification
        run: |
          echo "🎉 Deployment completed successfully!"
          echo "Environment: Staging"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"

  # ======================================
  # Summary
  # ======================================
  summary:
    name: 📊 Pipeline Summary
    runs-on: ubuntu-latest
    needs: [secret-scan, build-and-test, security-audit]
    if: always()
    permissions:
      contents: read
    
    steps:
      - name: Check results
        run: |
          echo "==================================="
          echo "CI/CD Pipeline Summary"
          echo "==================================="
          echo "Secret Scan: ${{ needs.secret-scan.result }}"
          echo "Build & Test: ${{ needs.build-and-test.result }}"
          echo "Security Audit: ${{ needs.security-audit.result }}"
          echo "==================================="
          
          if [ "${{ needs.secret-scan.result }}" != "success" ]; then
            echo "❌ Secret scanning failed - potential secrets detected!"
            exit 1
          fi
          
          if [ "${{ needs.build-and-test.result }}" != "success" ]; then
            echo "❌ Build or tests failed!"
            exit 1
          fi
          
          echo "✅ All checks passed!"
