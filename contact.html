<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>יצירת קשר - מעקב משלוחים</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">בית</a></li>
                <li><a href="about.html">אודות</a></li>
                <li><a href="contact.html">יצירת קשר</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="contact-section">
            <h1>יצירת קשר</h1>
            <p>יש לכם שאלות? רעיונות לשיפור? נשמח לשמוע מכם!</p>
            <p>שלחו לנו הודעה דרך הטופס למטה, ונחזור אליכם בהקדם האפשרי.</p>
            
            <form action="mailto:eladokashi@gmail.com" method="post" enctype="text/plain">
                <label for="name">שם מלא:</label>
                <input type="text" id="name" name="name" required placeholder="הזן את שמך">
                
                <label for="email">אימייל:</label>
                <input type="email" id="email" name="email" required placeholder="your.email@example.com">
                
                <label for="phone">טלפון (אופציונלי):</label>
                <input type="tel" id="phone" name="phone" placeholder="050-1234567">
                
                <label for="subject">נושא:</label>
                <select id="subject" name="subject" required>
                    <option value="">בחר נושא</option>
                    <option value="general">פניה כללית</option>
                    <option value="support">תמיכה טכנית</option>
                    <option value="suggestion">הצעה לשיפור</option>
                    <option value="business">פניה עסקית</option>
                </select>
                
                <label for="message">הודעה:</label>
                <textarea id="message" name="message" required placeholder="כתוב כאן את הודעתך..." rows="6"></textarea>
                
                <button type="submit">שלח הודעה</button>
            </form>
            
            <div class="contact-info">
                <h2>פרטי התקשרות נוספים</h2>
                <p><strong>אימייל:</strong> eladokashi@gmail.com</p>
                <p><strong>שעות פעילות:</strong> ראשון - חמישי, 09:00 - 17:00</p>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2025 מעקב משלוחים בינלאומיים. כל הזכויות שמורות.</p>
    </footer>
</body>
</html>
